[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-likes-sync"
version = "0.4.0"
description = "Windows YouTube Music likes to browserless validated FLAC sync"
requires-python = ">=3.11"
dependencies = ["ytmusicapi==1.12.2", "requests>=2.32.4,<3", "mutagen==1.47.0", "defusedxml==0.7.1", "imageio-ffmpeg==0.6.0", "psutil==7.2.2", "pystray==0.19.5", "Pillow==12.3.0"]

[project.scripts]
ytlikes = "ytlikes.cli:main"

[tool.setuptools.packages.find]
include = ["ytlikes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
